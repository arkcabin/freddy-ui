name: Release & Changelog Automation

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        uses: google-github-actions/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout repository
        if: ${{ steps.release.outputs.releases_created }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: ${{ steps.release.outputs.releases_created }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        if: ${{ steps.release.outputs.releases_created }}
        run: npm ci

      - name: Sync web visual changelog
        if: ${{ steps.release.outputs.releases_created }}
        run: |
          npx tsx ./scripts/sync-changelog.mts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/data/changelog-data.tsx
          git commit -m "chore: sync web changelog for ${{ steps.release.outputs.tag_name }} [skip ci]" || echo "No changes to commit"
          git push

